image: node:10.9.0

deploy:
  only:
    refs:
      - master
  environment:
    name: production
  script:
    - cd $DEPLOY_DIR
    - git pull
    - docker-compose build frontend
    - systemctl restart docker.service

cache:
  paths:
  - node_modules/

pages:
  stage: deploy
  script:
  - CI=true npm install
  - CI=true npm run build
  - rm -rf public
  - mv build public
  artifacts:
    paths:
    - public
  only:
  - master
